<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Ticket Watcher - GP Portugal 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0d;
    --surface: #15161c;
    --surface-2: #1d1f26;
    --border: #2b2d36;
    --text: #f4f4f6;
    --text-dim: #9195a1;
    --accent: #e10600;
    --accent-hover: #ff1a10;
    --green: #17c964;
    --green-soft: #17c96422;
    --amber: #f5a623;
    --amber-soft: #f5a62322;
    --red-soft: #e1060022;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Titillium Web', -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 1040px; margin: 0 auto; padding: 0 20px 40px;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 0; border-bottom: 3px solid var(--accent); margin-bottom: 18px;
    flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .f1 {
    background: var(--accent); color: #fff; font-weight: 900; font-size: 1.05rem;
    padding: 4px 9px; border-radius: 4px; letter-spacing: 0.02em;
  }
  .brand h1 {
    font-size: 1.15rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; margin: 0; color: var(--text);
  }
  .toolbar { display: flex; align-items: center; gap: 12px; }
  #refreshBtn {
    padding: 10px 20px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-family: inherit;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    font-size: 0.85rem; cursor: pointer; transition: background .15s;
  }
  #refreshBtn:hover:not(:disabled) { background: var(--accent-hover); }
  #refreshBtn:disabled { opacity: 0.55; cursor: default; }
  #refreshStatus { font-size: 0.8rem; color: var(--text-dim); }

  .subbar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px;
  }
  .pill-info {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 6px 14px; border-radius: 999px; font-size: 0.78rem;
  }
  .pill-info b { color: var(--text); font-weight: 600; }

  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .badge.waiting { background: var(--amber-soft); color: var(--amber); }
  .badge.onsale { background: var(--green-soft); color: var(--green); }
  .badge.error { background: var(--red-soft); color: #ff6b63; }
  .meta { color: var(--text-dim); font-size: 0.82rem; margin-top: 4px; }
  .meta a { color: var(--text-dim); }

  .layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: stretch; }
  @media (max-width: 680px) { .layout { grid-template-columns: 1fr; } }

  /* base card look shared by the primary target and the secondary ones --
     same shape (radius, border, surface), only size/emphasis differs */
  .target-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; display: flex; flex-direction: column; gap: 6px;
    justify-content: center;
  }
  .target-card .flag { font-size: 1.1rem; line-height: 1; opacity: 0.6; }
  .target-card .site-label {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); font-weight: 700;
  }
  .target-card .name { font-size: 0.95rem; font-weight: 700; }
  .target-card .badge { font-size: 0.68rem; padding: 3px 10px; width: fit-content; }
  .target-card .meta { font-size: 0.76rem; }

  .target-card--primary {
    padding: 26px 28px; gap: 10px; min-height: 170px; height: 100%;
    background: linear-gradient(155deg, var(--red-soft), var(--surface) 55%);
    box-shadow: 0 10px 30px -12px #e1060055;
  }
  .target-card--primary .flag { font-size: 1.7rem; opacity: 1; }
  .target-card--primary .site-label { color: var(--accent); font-size: 0.76rem; letter-spacing: 0.08em; }
  .target-card--primary .name { font-size: 1.35rem; font-weight: 900; margin: 2px 0 6px; letter-spacing: 0.01em; }
  .target-card--primary .badge { font-size: 0.9rem; padding: 6px 16px; }

  .secondary-list { display: flex; flex-direction: column; gap: 10px; justify-content: center; }

  h2.section {
    font-size: 0.82rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; margin: 32px 0 10px; font-weight: 700;
  }
  #events {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 0.8rem;
    max-height: 260px; overflow-y: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px;
  }
  .event { margin-bottom: 5px; color: var(--text-dim); }
  .event.alert { color: var(--green); font-weight: 700; }
  .event.error { color: #ff6b63; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <span class="f1">F1</span>
      <h1>Ticket Watcher — GP Portugal</h1>
    </div>
    <div class="toolbar">
      <span id="refreshStatus"></span>
      <button id="refreshBtn" onclick="manualRefresh()">Verificar agora</button>
    </div>
  </div>

  <div class="subbar">
    <span class="pill-info">Ritmo real: <b id="pollInterval">-</b></span>
    <span class="pill-info">Esta página relê o estado local a cada <b>3s</b> (sem pedidos aos sites)</span>
  </div>

  <div class="layout">
    <div id="primaryTarget"></div>
    <div id="secondaryTargets" class="secondary-list"></div>
  </div>

  <h2 class="section">Registo de eventos</h2>
  <div id="events"></div>

<script>
function formatInterval(seconds) {
  if (seconds == null) return '-';
  if (seconds < 60) return `1x a cada ${seconds}s`;
  if (seconds < 3600) return `1x a cada ${Math.round(seconds / 60)} min`;
  if (seconds < 86400) return `1x a cada ${Math.round(seconds / 3600)}h`;
  return `${Math.round(86400 / seconds)}x por dia`;
}

async function refresh() {
  const res = await fetch('/api/status');
  const data = await res.json();

  document.getElementById('pollInterval').textContent = formatInterval(data.poll_interval_seconds);

  const primaryDiv = document.getElementById('primaryTarget');
  const secondaryDiv = document.getElementById('secondaryTargets');
  primaryDiv.innerHTML = '';
  secondaryDiv.innerHTML = '';

  for (const [name, t] of Object.entries(data.targets || {})) {
    const badgeClass = t.status && t.status.includes('VENDA') ? 'onsale'
                      : t.status === 'erro' ? 'error' : 'waiting';

    if (t.primary) {
      primaryDiv.innerHTML += `
        <div class="target-card target-card--primary">
          <div class="flag">🏁</div>
          <div class="site-label">Site oficial de compra</div>
          <div class="name">${name}</div>
          <span class="badge ${badgeClass}">${t.status || 'a iniciar'}</span>
          <div class="meta">Ultima verificacao: ${t.last_checked || '-'}</div>
          <div class="meta"><a href="${t.url || '#'}" target="_blank">${t.url || ''}</a></div>
        </div>`;
    } else {
      secondaryDiv.innerHTML += `
        <div class="target-card">
          <div class="flag">🏁</div>
          <div class="site-label">Fonte secundária</div>
          <div class="name">${name}</div>
          <span class="badge ${badgeClass}">${t.status || 'a iniciar'}</span>
          <div class="meta">Ultima verificacao: ${t.last_checked || '-'}</div>
          <div class="meta"><a href="${t.url || '#'}" target="_blank">${t.url || ''}</a></div>
        </div>`;
    }
  }

  const eventsDiv = document.getElementById('events');
  eventsDiv.innerHTML = (data.events || []).slice().reverse().map(e =>
    `<div class="event ${e.level}">[${e.time}] ${e.message}</div>`
  ).join('');
}
async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  const statusEl = document.getElementById('refreshStatus');
  btn.disabled = true;
  statusEl.textContent = 'A verificar...';
  try {
    await fetch('/api/refresh', { method: 'POST' });
    statusEl.textContent = 'Verificacao concluida.';
  } catch (err) {
    statusEl.textContent = 'Falha ao verificar.';
  } finally {
    await refresh();
    btn.disabled = false;
    setTimeout(() => { statusEl.textContent = ''; }, 4000);
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
